versioning:
  scheme: uri-path
  current_versions:
    safe_one: v3
    balbix: v1
  example: /api/v3/assets
  policy_published: false
  source: 'Accessing SAFE APIs FAQ: "The API versioning is done using versions API endpoints for, e.g., /api/v3/assets."'
  note: >-
    SAFE states HOW it versions but publishes no version POLICY - no support window for a
    retired major, no notice period, no migration guide, and no record of v1 or v2. The
    Balbix guide says its API "is under active development, with many new endpoints and
    query parameters planned", which is a forward-compatibility warning without a
    compatibility contract.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy, no RFC 8594 Sunset or Deprecation response header, and no
    deprecated-operation list is published on any public SAFE or Balbix page. The one
    lifecycle change SAFE did announce in the window reviewed - retiring Recorded Future
    as the threat-intel feed in favour of VulnCheck from 1 June 2026 - was announced in
    release notes with a dated cutover, which is the right shape but is a data-source
    change rather than an API deprecation.
  evidence:
  - url: https://docs.safe.security/balbixhelp/docs/release-notes-june-2026
    status: 200
