data_residency:
  configurable: true
  url: https://docs.safe.security/docs/data-residency-in-safe
  note: >-
    Tenants select an AWS region at signup, and that choice determines the API base host -
    which is why apis.yml records us.safeone.ai as one instance of a per-region pattern
    rather than a single global base URL.
