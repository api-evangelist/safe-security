support:
  channel: Jira Service Desk (Customer Portal)
  url: https://safe-security.atlassian.net/servicedesk/customer/portal/11
  public: false
  note: >-
    Support is customer-only: "To access the Customer Portal, you must be a registered
    user". New users are onboarded by a Sales rep or Customer Success Manager. There is no
    public developer forum, no community Slack and no public issue tracker for the API.
    The Safe-Security/signal GitHub repository accepts issues and is the only public
    channel touching the API contract.
