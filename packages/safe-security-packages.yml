name: SAFE Security packages and SDKs
note: >-
  SAFE publishes no general-purpose REST client SDK for the SAFE One /api/v3 surface.
  What it does publish, first-party and open source, is the Signal specification -
  the JSON contract for pushing CA / VA / EDR / UBA security signals into SAFE - with
  type definitions and runnable connector sample applications in four languages. Only
  the Node.js package is distributed through a registry; the Python, C# and Java
  implementations are source-only inside the same MIT-licensed GitHub repository and
  therefore have no registry metadata endpoint to read a version from.
