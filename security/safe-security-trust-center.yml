gaps_for_provider:
- No trust portal; certifications are prose rather than requestable artefacts.
- No FedRAMP, HIPAA or PCI DSS attestation published despite healthcare and financial verticals being marketed.
- No subprocessor list published.
- CAA records absent on both domains; DNSSEC absent on safeone.ai.
