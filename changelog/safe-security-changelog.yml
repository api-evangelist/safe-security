gaps_for_provider:
- No API change log on either surface; version bumps are visible only as a path segment.
- SAFE One product updates are in-app only and have no public URL, so they cannot be watched, subscribed to or diffed.
- Release notes carry no version identifier, only a month.
- No RSS/Atom feed for release notes (the status page has one; the release notes do not).
