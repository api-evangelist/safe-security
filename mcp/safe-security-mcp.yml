note: >-
  This is a CANDIDATE tool surface derived from operations SAFE documents publicly, not a
  server anybody ships. Every operation named above appears verbatim in SAFE's own public
  documentation or in the MIT-licensed Safe-Security/signal repository, so no endpoint is
  invented. Input schemas are only partially known: SAFE's authoritative Swagger reference
  is served inside the authenticated application (User Profile > Help > SAFE API) and is
  not retrievable anonymously, so parameters are recorded only where the docs spell them
  out. Both APIs are per-tenant - a real server would have to take the tenant host
  (us/eu/ap/au.safeone.ai, or a <tenant>.balbix.net host issued by Balbix) as configuration.
