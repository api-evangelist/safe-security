apis:
- name: SAFE REST API
  description: 'The SAFE REST API (v3) gives customers and partners programmatic access
    to the SAFE One platform: users, assets/technology, findings, risk scenarios,
    reports, audit-log export, and full lifecycle management of the platform''s
    product integrations. Authentication is a two-step exchange - HTTP Basic with an
    API username/password generated in Settings > API Credentials, then POST /api/v3/auth
    to mint a one-hour bearer access token. The API is served from the customer''s own
    regional tenant host on safeone.ai; the Swagger reference is published inside the
    authenticated application (User Profile > Help > SAFE API) and is not reachable
    anonymously.'
  humanURL: https://docs.safe.security/docs/accessing-safe-apis
  baseURL: https://us.safeone.ai/api/v3
