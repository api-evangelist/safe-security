aid: safe-security
name: SAFE Security
description: 'SAFE Security (SAFE, formerly Lucideus) is a Palo Alto based cyber risk
  management company whose SAFE One platform quantifies cyber risk in financial terms
  on the FAIR standard, unifying Cyber Risk Quantification (CRQ), Third-Party Risk
  Management (TPRM), Continuous Threat Exposure Management (CTEM) and AI Security
  Posture Management (AI-SPM). The platform is API-first: a versioned REST API at
  /api/v3 on a per-tenant safeone.ai host lets customers pull users, assets, findings,
  risk scenarios, reports and audit logs, and drive the 50+ product integrations
  programmatically, while an open-source Signal specification (MIT, github.com/Safe-Security/signal)
  defines the JSON contract for pushing CA, VA, EDR and UBA security signals into
  SAFE from any tool. SAFE acquired RiskLens in 2023 and Balbix in 2025.'
