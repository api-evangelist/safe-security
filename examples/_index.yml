  description: User Behaviour Analytics signal exercising the full vocabulary.
not_covered:
  note: >-
    No published example exists for any READ operation. GET /api/v3/users, POST/GET
    /api/v3/reports and the audit-log export endpoints have response examples embedded in
    the Audit APIs docs page but are not published as files; the Balbix surface has cURL
    and response examples in its guide but likewise ships no example files.
